name: CI (lint → build → deploy)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One pipeline at a time per branch; never two concurrent runs racing on Pages.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 1. Fast blocking checks. Stops the pipeline if format/wikilinks/docs are broken.
  lint:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install root deps (lint tooling)
        run: bun install --frozen-lockfile
      - name: Install audit-notes deps
        working-directory: scripts/audit-notes
        run: bun install --frozen-lockfile
      - name: Install Starlight docs deps
        working-directory: sites/docs
        run: bun install --frozen-lockfile
      - name: Lint (vault + Pass 0 + Starlight)
        run: bun run lint:ci
      - name: Unit tests
        run: bun run test:ci

  # PR-only: full Starlight build (Twoslash). Quartz merge needs a private fork token.
  docs-build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install root deps
        run: bun install --frozen-lockfile
      - name: Install Starlight docs deps
        working-directory: sites/docs
        run: bun install --frozen-lockfile
      - name: Build Starlight (Twoslash)
        run: bun run docs:build

  # 2. Build Quartz + Starlight, merge for GitHub Pages. Skipped on pull_request.
  build:
    needs: lint
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout content
        uses: actions/checkout@v5
        with:
          path: content-repo
          fetch-depth: 0
      - name: Checkout Quartz fork
        uses: actions/checkout@v5
        with:
          repository: LOsioChico/quartz-fork
          ref: main
          path: quartz
          token: ${{ secrets.QUARTZ_FORK_READ_TOKEN }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install Quartz deps
        working-directory: quartz
        run: npm ci
      - name: Build Quartz against this repo's content
        working-directory: quartz
        run: npx quartz build -d ../content-repo/content
      - name: Install Starlight docs deps
        working-directory: content-repo/sites/docs
        run: bun install --frozen-lockfile
      - name: Build Starlight docs
        working-directory: content-repo/sites/docs
        run: bun run build
      - name: Merge Quartz + Starlight output
        working-directory: content-repo
        run: node scripts/merge-pages.mjs quartz/public sites/docs/dist merged-public
      - name: Verify merged Starlight paths
        working-directory: content-repo
        run: |
          test -f merged-public/index.html
          test -f merged-public/effect-ts/index.html
          test -f merged-public/effect-ts/quickstart/index.html
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: content-repo/merged-public

  # 3. Deploy to GitHub Pages.
  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
