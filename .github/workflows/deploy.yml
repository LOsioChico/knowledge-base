name: CI (lint → build → deploy)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One pipeline at a time per branch; never two concurrent runs racing on Pages.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 1. Fast blocking checks. Stops the pipeline if format/wikilinks/docs are broken.
  lint:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install root deps (lint tooling)
        run: bun install --frozen-lockfile
      - name: Install audit-notes deps
        working-directory: scripts/audit-notes
        run: bun install --frozen-lockfile
      - name: Install Starlight docs deps
        working-directory: sites/docs
        run: bun install --frozen-lockfile
      - name: Lint (vault + Pass 0 + Starlight)
        run: bun run lint:ci
      - name: Unit tests
        run: bun run test:ci

  # PR + main: Starlight build (Twoslash).
  docs-build:
    needs: lint
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install root deps
        run: bun install --frozen-lockfile
      - name: Install Starlight docs deps
        working-directory: sites/docs
        run: bun install --frozen-lockfile
      - name: Build Starlight (Twoslash)
        run: bun run docs:build

  # 2. Deploy Starlight dist to GitHub Pages. Skipped on pull_request.
  build:
    needs: docs-build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install root deps
        run: bun install --frozen-lockfile
      - name: Install Starlight docs deps
        working-directory: sites/docs
        run: bun install --frozen-lockfile
      - name: Build Starlight docs
        working-directory: sites/docs
        run: bun run build
      - name: Verify published paths
        working-directory: sites/docs
        run: |
          test -f dist/index.html
          test -f dist/effect-ts/quickstart/index.html
          test -f dist/nestjs/fundamentals/request-lifecycle/index.html
          test -f dist/nestjs/recipes/validation/index.html
          test -f dist/nestjs/recipes/file-uploads/index.html
          test -f dist/nestjs/data/caching/index.html
          test -f dist/nestjs/auth/jwt-strategy/index.html
          test -f dist/nestjs/releases/v11/index.html
          test -f dist/aws/index.html
          test -f dist/aws/s3/quickstart/index.html
          test -f dist/aws/lambda-vs-ec2/index.html
          test -f dist/aws/recipes/cross-account-role-pattern/index.html
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: sites/docs/dist

  # 3. Deploy to GitHub Pages.
  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
