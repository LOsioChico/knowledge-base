name: CI (lint → build → deploy)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One pipeline at a time per branch; never two concurrent runs racing on Pages.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 1. Fast blocking checks. Stops the pipeline if format/wikilinks are broken.
  lint:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install root deps (lint tooling)
        run: bun install --frozen-lockfile
      - name: Lint wikilinks
        run: bun run lint:wikilinks
      - name: Lint content (Pass 0)
        working-directory: scripts/audit-notes
        run: |
          bun install --frozen-lockfile
          bun run lint:content
          bun run lint:format

  # 2. Build the site by cloning the Quartz fork at build time. Skipped on
  # pull_request: deploy is main-only. To pin a specific Quartz version,
  # change `ref:` below to a tag or commit SHA on LOsioChico/quartz-fork.
  build:
    needs: lint
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout content
        uses: actions/checkout@v5
        with:
          path: content-repo
          fetch-depth: 0
      - name: Checkout Quartz fork
        uses: actions/checkout@v5
        with:
          repository: LOsioChico/quartz-fork
          ref: main
          path: quartz
          token: ${{ secrets.QUARTZ_FORK_READ_TOKEN }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install Quartz deps
        working-directory: quartz
        run: npm ci
      - name: Build Quartz against this repo's content
        working-directory: quartz
        run: npx quartz build -d ../content-repo/content
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: quartz/public

  # 3. Deploy to GitHub Pages.
  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
