name: CI (lint → build → deploy)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Cancel superseded runs on the same branch (saves queue time on rapid pushes).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Single job: one install, astro check once, build once. PRs stop before upload.
  ci:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Cache Bun
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'scripts/audit-notes/bun.lock', 'sites/docs/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-
      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          bun install --frozen-lockfile --cwd scripts/audit-notes
          bun install --frozen-lockfile --cwd sites/docs
      - name: Lint (wikilinks + MDX check, no build)
        run: |
          bun run lint:ci:tooling
          bun run lint:docs
      - name: Unit tests
        run: bun run test:ci
      - name: Cache Astro build
        if: github.event_name != 'pull_request'
        uses: actions/cache@v4
        with:
          path: sites/docs/node_modules/.astro
          key: astro-${{ runner.os }}-${{ hashFiles('sites/docs/src/content/docs/**/*.mdx') }}
          restore-keys: |
            astro-${{ runner.os }}-
      - name: Build Starlight (Twoslash)
        if: github.event_name != 'pull_request'
        run: bun run docs:build:ci
      - name: Verify published paths
        if: github.event_name != 'pull_request'
        working-directory: sites/docs
        run: |
          test -f dist/index.html
          test -f dist/effect-ts/quickstart/index.html
          test -f dist/nestjs/fundamentals/request-lifecycle/index.html
          test -f dist/nestjs/recipes/validation/index.html
          test -f dist/nestjs/recipes/file-uploads/index.html
          test -f dist/nestjs/data/caching/index.html
          test -f dist/nestjs/auth/jwt-strategy/index.html
          test -f dist/nestjs/releases/v11/index.html
          test -f dist/aws/index.html
          test -f dist/aws/s3/quickstart/index.html
          test -f dist/aws/lambda-vs-ec2/index.html
          test -f dist/aws/recipes/cross-account-role-pattern/index.html
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: sites/docs/dist

  deploy:
    needs: ci
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
