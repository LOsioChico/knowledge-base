strict_tdd: false
context: |
  knowledge-base: vault content/ (Obsidian markdown, not deployed) + published sites/docs/ (Starlight MDX). Full vault ↔ MDX parity except inbox.md; enforced by bun run lint:publish-parity.
  Operating contract: AGENTS.md; kb-author (vault A–P, MDX S1–S6); docs/PUBLISHING.md; Starlight-only deploy.
  Tooling (Bun/Node ESM): scripts/lint-wikilinks.mjs, scripts/lint-mdx-*.mjs, scripts/vault-check.mjs, scripts/audit-notes/.
  Strict TDD applies only to scripts/** changes. content/ edits use vault lint + audit, not test-first TDD.
  Post-edit gate when content/ changed: bun run vault:check --base HEAD~1 (LLM audit needs CURSOR_API_KEY in repo-root .env).
  vault:check also runs lint:docs when sites/docs/ is in the git diff.
  After sites/docs/ only: bun run lint:docs && bun run docs:build. sites/docs uses Bun (bun.lock).
  Linter-only (no LLM): bun run lint:ci (vault wikilinks + Pass 0 + lint:docs). Matches CI lint job.
  LLM audit profiles: cd scripts/audit-notes && bun run audit:triage (not root package.json).
  CI (.github/workflows/deploy.yml): lint:ci + test:ci on PR+main; docs:build on PR+main; Pages serves sites/docs/dist only. See docs/PIPELINE.md.
  Package managers: bun. Markers: package.json, scripts/audit-notes/package.json, sites/docs/package.json, GitHub Actions.
rules:
  proposal:
    require_problem_statement: true
  spec:
    require_acceptance_criteria: true
  design:
    require_tradeoffs: true
  tasks:
    protect_review_workload: true
  apply:
    test_command: "bun run test:ci"
  verify:
    test_command: "bun run lint:ci && bun run test:ci"
testing:
  detected: "2026-05-18"
  runner:
    command: "bun run test:ci"
    framework: "package script"
  layers:
    unit: "bun run test:ci (root scripts/*.test.mjs + audit-notes)"
    integration: ""
    e2e: ""
  commands:
    unit:
      - scope: "."
        command: "bun run test:ci"
        framework: "node:test via tsx (root wikilink/vault-check + audit-notes)"
    integration:
      []
    e2e:
      []
  coverage:
    command: ""
    commands:
      []
quality:
  lint: "bun run lint:ci"
  lint_commands:
    - scope: "."
      command: "bun run lint:ci"
      framework: "CI lint job (vault wikilinks + Pass 0 + Starlight)"
    - scope: "sites/docs"
      command: "bun run lint:docs"
      framework: "Starlight astro check + MDX wikilinks + link hygiene"
  typecheck: "cd scripts/audit-notes && bun run typecheck"
  typecheck_commands:
    - scope: "scripts/audit-notes"
      command: "cd scripts/audit-notes && bun run typecheck"
      framework: "tsc --noEmit"
  format: "cd scripts/audit-notes && bun run format"
  format_commands:
    - scope: "scripts/audit-notes"
      command: "cd scripts/audit-notes && bun run format"
      framework: "prettier write"
vault:
  check_command: "bun run vault:check --base HEAD~1"
  check_command_lint_only: "bun run lint:ci"
  source_urls_command: "scripts/check-source-urls.sh"
  audit_triage_command: "cd scripts/audit-notes && bun start --json --base HEAD~1 --profile=triage"
